<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учёт задач сотрудников</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

            form input, form select {
                padding: 6px;
                flex: 1;
                min-width: 120px;
            }

            form button {
                padding: 6px 16px;
            }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        button.small {
            padding: 4px 8px;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <h1>Система учёта задач сотрудников</h1>

    <form id="taskForm">
        <input type="text" id="title" placeholder="Тема задачи" required>
        <input type="text" id="employeeName" placeholder="Сотрудник" required>
        <input type="text" id="description" placeholder="Описание" required>
        <select id="priority">
            <option value="Низкий">Низкий</option>
            <option value="Обычный" selected>Обычный</option>
            <option value="Высокий">Высокий</option>
        </select>
        <button type="submit">Добавить</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Тема</th>
                <th>Сотрудник</th>
                <th>Приоритет</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="taskTableBody"></tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
